name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No Factorio install and no profile is activated here, so the suite
      # runs against whatever prototype data factorio-draftsman ships by
      # default -- see tests/prototypes.py and tests/conftest.py, which name
      # the active data set and skip, rather than fail, a check the loaded
      # data genuinely has nothing to answer.
      - run: pip install -e ".[dev]"

      - run: pytest -v

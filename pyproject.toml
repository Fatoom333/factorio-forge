[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-forge"
version = "0.1.0"
description = "Generate Factorio blueprints from a description, tailored to your own save and building style."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["factorio", "blueprint", "generator", "factory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
]

dependencies = [
    # Blueprint string codec, entity prototypes, collision boxes and the
    # `draftsman update` data lifecycle that resolves an installed mod set.
    #
    # This points at a fork of upstream `main`, because no release can build
    # game data for the mod sets we care about: 4.0.0 cannot run `update` at
    # all (upstream issue #227, fixed in `main`, not released). The fork adds
    # three fixes reported upstream and not merged yet (#235, #237, #238) and
    # extracts resources, asteroid chunks and surfaces, which draftsman leaves
    # out. See its FORK.md. The fixes go once they are released; the
    # extraction stays.
    "factorio-draftsman @ git+https://github.com/Fatoom333/factorio-draftsman@main-forge",
    # Decodes a prototype's own icon so the renderer can draw it in its real
    # colour instead of a family-level guess. See render._dominant_icon_colour.
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factorio-forge = "factorio_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

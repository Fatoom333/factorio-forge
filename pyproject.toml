[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-forge"
version = "0.1.0"
description = "Generate Factorio blueprints from a description, tailored to your own save and building style."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["factorio", "blueprint", "generator", "factory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
]

dependencies = [
    # Blueprint string codec, entity prototypes, collision boxes and the
    # `draftsman update` data lifecycle that resolves an installed mod set.
    #
    # Pinned below 4.0 deliberately. 4.0.0 cannot extract data from a game
    # installation at all: it looks for `compatibility/defines/<major>.<minor>.lua`
    # but the published wheel ships only the older flat `compatibility/defines.lua`,
    # so every `update` run dies on a missing file. 3.3.1 works, and its bundled
    # data tracks Factorio 2.0.77, which is the current stable game.
    #
    # Revisit when 4.x ships that directory. The API we use (`Blueprint.from_string`,
    # `update_draftsman_data`) is identical across both, so moving up should be a
    # version bump and nothing more.
    "factorio-draftsman>=3.3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factorio-forge = "factorio_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

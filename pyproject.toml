[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-forge"
version = "0.1.0"
description = "Generate Factorio blueprints from a description, tailored to your own save and building style."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["factorio", "blueprint", "generator", "factory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
]

dependencies = [
    # Blueprint string codec, entity prototypes, collision boxes and the
    # `draftsman update` data lifecycle that resolves an installed mod set.
    #
    # This points at a fork, temporarily, because no released version can build
    # game data for the mod sets we care about:
    #
    #   * 4.0.0 cannot run `update` at all -- it loads
    #     `compatibility/defines/<major>.<minor>.lua`, which the published wheel
    #     does not contain (upstream issue #227).
    #   * 3.3.1 runs, but `require` returns a fresh copy of a module on every
    #     call, which breaks any mod whose files share a table -- a common
    #     layout -- and it reads a Space Age prototype without checking whether
    #     the expansion is loaded, which fails for every mod set without it.
    #
    # The fork is upstream 3.3.1 plus those last two fixes and nothing else;
    # both are reported upstream. See its FORK.md. Once they are released this
    # goes back to a plain version specifier.
    "factorio-draftsman @ git+https://github.com/Fatoom333/factorio-draftsman@3.3.1-forge",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factorio-forge = "factorio_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
